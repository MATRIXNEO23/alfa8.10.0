name: Build Neon Tides APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test deterministic dialogue
        run: |
          gradle :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Verify stable APK signature
        run: |
          SIGNATURE_OUTPUT=$("$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$SIGNATURE_OUTPUT"
          CERT_DIGEST=$(echo "$SIGNATURE_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          test "$CERT_DIGEST" = "d448aea352dd3eb38ab5c918c979d731f6cf97f2faa04e88b11f61296fb65097"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NeonTides-alfa8.10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonTides-alfa8.10-apk
          path: out/NeonTides-alfa8.10.apk
